# Scope default test collection to this rig's own tests.
#
# `dev/` holds two engine checkouts (untracked working copies), each with its own suite under a directory
# named `tests`; two packages with the same name cannot be collected in one pytest run, so a bare `pytest`
# from this root would stop on import-path errors in files this rig does not own. The engine's own
# pyproject.toml scopes collection the same way.
[pytest]
testpaths = tests
